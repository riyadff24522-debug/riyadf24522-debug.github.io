<style>
:root{--bg:#f8fafc;--text:#1e293b;--card:#fff;--cardB:#f1f5f9;--shadow:0 10px 25px -5px rgba(0,0,0,.05);--input:#f8fafc;--inputB:#e2e8f0;--nav:#fff;--navB:#e2e8f0;--header:linear-gradient(135deg,#4f46e5,#7c3aed);--noticeB:#fffbeb;--noticeBd:#fde68a;--noticeC:#b45309;--depNtB:#f0fdf4;--depNtBd:#bbf7d0;--depNtC:#166534;--popup:#fff;--popupT:#1e293b;--hist:#fff;--histB:#e2e8f0;--histT:#0f172a;--pendB:#fef3c7;--pendT:#b45309;--compB:#dcfce7;--compT:#15803d;--rejB:#fee2e2;--rejT:#b91c1c;--msgUB:#eef2ff;--msgUBd:#4f46e5;--blkB:#fee2e2;--blkBd:#fca5a5;--blkC:#991b1b;--gift:linear-gradient(135deg,#fff7ed,#ffedd5);--giftBd:#fed7aa}

*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:background .3s,color .3s}
#blockedScreen,#joinGateScreen,#tgOnlyScreen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px;overflow-y:auto}
#blockedScreen.active,#joinGateScreen.active,#tgOnlyScreen.active{display:flex}
.blocked-box{background:var(--popup);max-width:420px;width:100%;border-radius:28px;padding:32px 24px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.3);border:2px solid var(--blkBd)}
.blocked-box .icon{font-size:64px;margin-bottom:12px}
.blocked-box h2{color:var(--blkC);font-size:24px;font-weight:900;margin-bottom:8px}
.blocked-box .reason{background:var(--input);padding:12px;border-radius:12px;margin:16px 0;font-size:14px;color:var(--blkC);font-weight:700;border:1px solid var(--blkBd)}
#tgOnlyScreen{background:linear-gradient(135deg,#0f172a,#1e1b4b)}
.tg-only-box{background:linear-gradient(135deg,#1e293b,#0f172a);max-width:420px;width:100%;border-radius:28px;padding:36px 24px;text-align:center;border:2px solid #3b82f6;box-shadow:0 25px 60px rgba(59,130,246,.3)}
.tg-only-box .tg-icon{font-size:80px;margin-bottom:16px;animation:tgPulse 2s infinite}

.tg-only-box p{color:#94a3b8;font-size:14px;line-height:1.7;margin-bottom:20px;font-weight:600}
.tg-only-box .tg-btn{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;padding:14px 28px;border-radius:14px;font-weight:900;font-size:15px;text-decoration:none;margin-top:10px;box-shadow:0 8px 25px rgba(59,130,246,.4)}
.join-gate-box{background:var(--popup);max-width:440px;width:100%;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.3);border:2px solid var(--msgUBd)}
.join-gate-box .jg-icon{font-size:64px;margin-bottom:10px}
.join-gate-box h2{color:#4f46e5;font-size:22px;font-weight:900;margin-bottom:8px}
.join-gate-box p{color:var(--text);font-size:14px;opacity:.8;line-height:1.6;margin-bottom:18px;font-weight:600}
.jg-channel{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;background:var(--cardB);border:2px solid var(--cardB);margin-bottom:10px;transition:all .3s}
.jg-channel.joined{border-color:#10b981;background:linear-gradient(135deg,#dcfce7,#bbf7d0)}
.jg-left{display:flex;align-items:center;gap:10px;text-align:left;flex:1;min-width:0}
.jg-icon-box{width:36px;height:36px;border-radius:10px;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-size:16px}
.jg-icon-box.g2{background:#8b5cf6}
.jg-icon-box.g3{background:#f59e0b}
.jg-icon-box.g4{background:#ec4899}
.jg-name{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-sub{font-size:10px;color:var(--text);opacity:.6;font-weight:600;margin-top:2px}
.jg-btn{padding:8px 14px;border-radius:20px;border:none;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;flex-shrink:0}
.jg-btn.done{background:#10b981;cursor:default}
.jg-verify-btn{width:100%;padding:14px;margin-top:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
.jg-verify-btn:disabled{background:#475569;cursor:not-allowed}
#app{display:none;height:100vh;flex-direction:column;position:relative}
.header{background:var(--header);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(79,70,229,.15);min-height:60px;position:relative;z-index:95}
.header h1{font-size:15px;font-weight:800;letter-spacing:.3px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:6px}
.balance-badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:30px;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.header-icon-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative;color:#fff;flex-shrink:0}
.header-icon-btn .badge-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:1.5px solid rgba(79,70,229,.8)}
.header-icon-btn .badge-dot.hidden{display:none}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:80px;position:relative;background:var(--bg)}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--cardB)}
.card h3{font-size:17px;margin-bottom:14px;color:var(--text);font-weight:800}
.stat-row{display:flex;justify-content:space-between;margin:10px 0;font-size:14px;align-items:center;color:var(--text);opacity:.8}
.stat-row span:last-child{font-weight:700;color:#4f46e5}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.info-box{position:relative;border-radius:18px;padding:16px 14px;text-align:left;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.info-box .ib-icon{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;border:1px solid rgba(255,255,255,.3)}
.info-box .box-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;opacity:.9;margin-bottom:4px}
.info-box .box-value{font-size:19px;font-weight:900;letter-spacing:-.5px;word-break:break-all}
.info-box .box-value small{font-size:11px;font-weight:700;opacity:.8;margin-left:2px}
.info-box.ib-balance{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff}
.info-box.ib-refer{background:linear-gradient(135deg,#10b981 0%,#059669 100%);color:#fff}
.info-box.ib-users{background:linear-gradient(135deg,#06b6d4 0%,#0891b2 100%);color:#fff}
.info-box.ib-commission{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#fff}
.home-avatar{position:relative;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:900;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 20px rgba(79,70,229,.35)}
.home-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.btn{display:inline-block;padding:10px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;text-align:center;transition:all .2s}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-blue{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.btn-orange{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff}
.btn-full{width:100%;margin-top:10px;padding:13px;font-size:15px}
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.method-option{border:2px solid var(--inputB);border-radius:14px;padding:10px;text-align:center;cursor:pointer;background:var(--input);font-weight:700;color:var(--text);transition:all .2s;opacity:.7}
.method-option.active{border-color:#4f46e5;background:var(--msgUB);color:#4f46e5;opacity:1}
.notice-box{background:var(--noticeB);border:1px solid var(--noticeBd);border-radius:12px;padding:10px;font-size:12px;color:var(--noticeC);margin-bottom:14px;font-weight:600;line-height:1.6}
.btn-disabled{background:#374151!important;color:#9ca3af!important;font-size:12px!important;font-weight:700!important;cursor:not-allowed!important;border:1px solid #4b5563}
.task-item{background:#111827!important;border:1px solid #1f2937!important;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.task-info{display:flex;align-items:center;gap:12px}
.task-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#1f2937;border:1px solid #1f2937}
.task-title{font-size:14px;font-weight:800;color:#fff!important}
.task-desc{font-size:12px;color:#fde047!important;margin-top:2px;font-weight:600}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:8px;background:var(--hist);border:1px solid var(--histB);border-radius:14px}
.history-info-left{display:flex;flex-direction:column;gap:3px}
.history-title{font-weight:800;font-size:13px;color:var(--histT)}
.history-subtext{font-size:11px;color:var(--text);opacity:.6;font-weight:600}
.history-time{font-size:10px;color:var(--text);opacity:.4;font-weight:500}
.history-info-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.history-amount{font-size:14px;font-weight:800}
.history-amount.pos{color:#10b981}
.history-amount.neg{color:#ef4444}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase}
.status-badge.pending{background:var(--pendB);color:var(--pendT);border:1px solid var(--noticeBd)}
.status-badge.completed{background:var(--compB);color:var(--compT);border:1px solid var(--depNtBd)}
.status-badge.rejected{background:var(--rejB);color:var(--rejT);border:1px solid #fca5a5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);display:flex;border-top:1px solid var(--navB);padding:6px 0;z-index:100}
.nav-item{flex:1;text-align:center;padding:4px 0;font-size:11px;color:var(--text);cursor:pointer;font-weight:700;position:relative;opacity:.5}
.nav-item.active{color:#4f46e5;opacity:1}
.nav-item .icon{font-size:20px;display:block;margin-bottom:1px}
.popup-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:2000}
.popup{background:var(--popup);width:88%;max-width:360px;border-radius:24px;padding:24px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-height:80vh;overflow-y:auto}
.popup .notice-item{text-align:left;padding:10px 0;border-bottom:1px solid var(--cardB)}
.popup .notice-item:last-child{border-bottom:none}
.popup .notice-item .notice-title{font-weight:800;font-size:14px;color:var(--popupT)}
.popup .notice-item .notice-body{font-size:13px;color:var(--text);opacity:.8;margin-top:4px;line-height:1.5}
.popup h3{margin-bottom:10px;font-size:20px;font-weight:800;color:var(--popupT)}
.claim-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.claim-popup-overlay.active{opacity:1;visibility:visible}
.claim-popup-card{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-radius:20px;padding:24px;width:90%;max-width:310px;text-align:center;transform:scale(.8);transition:transform .3s cubic-bezier(.175,.885,.32,1.275)}
.claim-popup-overlay.active .claim-popup-card{transform:scale(1)}
.claim-icon-wrapper{width:55px;height:55px;margin:0 auto 14px;background:rgba(16,185,129,.15);border-radius:50%;display:flex;align-items:center;justify-content:center}
.claim-popup-card h3{color:#fff;font-size:18px;margin-bottom:6px;font-weight:700}
.claim-popup-card p{color:#94a3b8;font-size:13px;margin-bottom:18px;line-height:1.4;white-space:pre-line}
.claim-close-btn{background:#10B981;color:#fff;border:none;width:100%;padding:11px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
.hidden{display:none!important}
.section{display:none}
.section.active{display:block}
.gift-hero{background:var(--gift);border-radius:16px;padding:20px 14px;text-align:center;margin-bottom:14px;border:1px solid var(--giftBd)}
.gift-box{font-size:50px;margin-bottom:6px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gift-hero h2{font-size:16px;color:var(--text);font-weight:800;margin-bottom:4px}
.gift-hero p{font-size:12px;color:var(--text);font-weight:600;opacity:.7}
.gift-input{width:100%;padding:12px 14px;border:2px solid var(--giftBd);border-radius:12px;font-size:14px;text-align:center;margin:10px 0;background:var(--input);font-weight:700;color:var(--text)}
.receive-btn{width:100%;padding:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
.gift-history-empty{text-align:center;padding:20px 10px;color:var(--text);opacity:.5}
.gift-history-empty .icon{font-size:34px;margin-bottom:6px;opacity:.5}

/* Unique Loader */
.loading-overlay{position:fixed;inset:0;background:rgba(10,10,25,.92);backdrop-filter:blur(15px);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.loading-overlay.active{display:flex}
.unique-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.loader-orb{width:70px;height:70px;background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);border-radius:50%;box-shadow:0 0 40px rgba(16,185,129,0.8), inset 0 0 20px rgba(255,255,255,0.4);animation:pulseOrb 1.8s infinite alternate ease-in-out;position:relative;z-index:3}
.loader-ring-outer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;height:110px;border:3px solid transparent;border-top-color:#10b981;border-bottom-color:#3b82f6;border-radius:50%;animation:spinRing 1.5s linear infinite;z-index:1}
.loader-ring-middle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:150px;height:150px;border:2px solid transparent;border-left-color:#8b5cf6;border-right-color:#ec4899;border-radius:50%;animation:spinRing 2.5s linear infinite reverse;z-index:1;opacity:.7}
.loader-ring-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:190px;height:190px;border:2px dashed transparent;border-top-color:#f59e0b;border-radius:50%;animation:spinRing 4s linear infinite;z-index:1;opacity:.4}
.loader-text{margin-top:80px;color:#f1f5f9;font-weight:900;font-size:15px;letter-spacing:2px;animation:fadeText 2s infinite alternate;text-align:center;position:relative;z-index:4}
.loader-subtext{margin-top:8px;color:#64748b;font-size:11px;font-weight:700;letter-spacing:1px;animation:fadeText 2s infinite alternate;text-align:center;position:relative;z-index:4}
@keyframes pulseOrb{0%{transform:scale(0.9);box-shadow:0 0 20px rgba(16,185,129,0.6)}100%{transform:scale(1.15);box-shadow:0 0 60px rgba(59,130,246,0.9)}}
@keyframes spinRing{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fadeText{0%{opacity:0.4;letter-spacing:2px}100%{opacity:1;letter-spacing:3px}}

/* Ref Box */
.ref-copy-box{position:relative;background:linear-gradient(135deg,#eef2ff 0%,#e0e7ff 100%);border:2px dashed #818cf8;border-radius:16px;padding:14px}
.ref-copy-box.copied{background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);border-color:#10b981}
.ref-copy-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.ref-copy-badge{font-size:9px;font-weight:800;color:#4f46e5;background:rgba(79,70,229,.12);padding:3px 8px;border-radius:20px;text-transform:uppercase}
.ref-link-display{background:#fff;border:1px solid #c7d2fe;border-radius:10px;padding:12px 14px;font-family:'Courier New',monospace;font-size:11px;color:#1e293b;word-break:break-all;font-weight:700;margin-bottom:10px;min-height:38px;display:flex;align-items:center;line-height:1.4;user-select:all}
body.dark-mode .ref-link-display{background:#0f172a;color:#f1f5f9;border-color:#4338ca}
.ref-copy-btn{width:100%;padding:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.ref-copy-btn.success{background:linear-gradient(135deg,#10b981,#059669)}
.split-banner{background:linear-gradient(135deg,#10b981 0%,#059669 100%);border-radius:14px;padding:14px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:0 6px 20px rgba(16,185,129,.3)}
.split-banner h4{font-size:15px;font-weight:900;margin-bottom:6px}
.split-banner .split-row{display:flex;align-items:center;justify-content:center;gap:14px;font-size:13px;font-weight:800;margin-top:8px}
.split-item{background:rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.3)}
.commission-info{background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);border:1px solid #fbbf24;border-radius:16px;padding:14px;margin-bottom:14px}
.commission-info h4{font-size:14px;font-weight:900;color:#78350f;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.commission-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;font-weight:800;color:#92400e;border-bottom:1px dashed rgba(120,53,15,.2)}
.commission-row:last-child{border-bottom:none}
.commission-row span:last-child{color:#059669;font-weight:900}
.dual-condition-box{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:2px solid #a78bfa;border-radius:16px;padding:14px;margin-bottom:14px}
.condition-row{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--cardB);border-radius:12px;padding:10px 12px}
.condition-row.unlocked{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#10b981}
.condition-status{font-size:10px;font-weight:900;padding:3px 10px;border-radius:20px;text-transform:uppercase;background:#fee2e2;color:#991b1b}
.condition-status.unlocked{background:#dcfce7;color:#15803d}

/* Ad Overlay */
.ad-overlay{position:fixed;inset:0;background:linear-gradient(180deg,#000 0%,#0a0a1a 100%);display:none;flex-direction:column;z-index:999999}
.ad-overlay.active{display:flex}
.ad-top-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;position:relative;z-index:10}
.ad-timer-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:30px;font-size:15px;font-weight:900;border:1px solid rgba(255,255,255,.25)}
.ad-timer-chip.done{background:rgba(16,185,129,.25);border-color:#10b981;color:#10b981}
.ad-progress-label{font-size:11px;color:#94a3b8;font-weight:800;padding:8px 14px;background:rgba(255,255,255,.08);border-radius:20px}

.ad-box{width:100%;max-width:340px;aspect-ratio:9/16;max-height:58vh;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #334155;position:relative;overflow:hidden}

@keyframes spinBg{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ad-box-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.ad-brand-tag{position:absolute;top:14px;right:14px;font-size:9px;font-weight:900;letter-spacing:2px;color:#f59e0b;background:rgba(245,158,11,.15);padding:5px 11px;border-radius:20px;border:1px solid rgba(245,158,11,.3);z-index:3}
.ad-reward-tag{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#10b981;background:rgba(16,185,129,.15);padding:7px 16px;border-radius:20px;border:1px solid rgba(16,185,129,.4);z-index:3;white-space:nowrap}
.ad-big-icon{font-size:76px;animation:aeBounce 1.5s infinite}
.ad-title{font-size:19px;font-weight:900;color:#fff;text-align:center;line-height:1.3}
.ad-subtitle{font-size:13px;color:#94a3b8;font-weight:600;text-align:center}
.ad-progress-ring{position:relative;width:100px;height:100px;margin-top:8px}
.ad-progress-ring svg{transform:rotate(-90deg);width:100px;height:100px}
.ad-progress-ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ad-progress-ring .ring-bg{stroke:rgba(255,255,255,.1)}
.ad-progress-ring .ring-fill{stroke:url(#adRingGrad);stroke-dasharray:283;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.ad-ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff}
.ad-claim-btn{width:100%;max-width:340px;padding:16px;border-radius:16px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:900;font-size:16px;cursor:pointer;opacity:.35;pointer-events:none;font-family:inherit;margin-top:16px}
.ad-claim-btn.active{opacity:1;pointer-events:auto}
.ad-close-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);font-size:18px;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;position:absolute;top:16px;right:16px;z-index:20}
.ad-close-btn.visible{display:flex}
.ad-warning-tag{font-size:11px;color:#f59e0b;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:8px 14px;margin-top:16px;font-weight:800;max-width:340px}
.ad-bottom-info{padding:16px 20px;text-align:center}
.ad-bottom-info p{font-size:11px;color:#64748b;font-weight:700}

/* WD Complete */
.wd-complete-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:99999;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;padding:20px}
.wd-complete-overlay.active{opacity:1;visibility:visible}
.wd-complete-card{background:linear-gradient(135deg,#064e3b 0%,#065f46 100%);border-radius:24px;padding:28px 22px;width:100%;max-width:340px;text-align:center;transform:scale(.7);transition:transform .4s;border:2px solid #10b981}
.wd-complete-overlay.active .wd-complete-card{transform:scale(1)}
.wd-complete-card .wd-check{width:80px;height:80px;margin:0 auto 16px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px}
.wd-complete-card h2{color:#fff;font-size:22px;margin-bottom:8px;font-weight:900}
.wd-complete-card .wd-amt{color:#fbbf24;font-size:32px;font-weight:900;margin:12px 0 16px}
.wd-complete-card p{color:#a7f3d0;font-size:13px;margin-bottom:20px;line-height:1.6;font-weight:600}
.wd-complete-card .wd-info{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;margin-bottom:20px;font-size:12px;color:#fff;font-weight:700}
.wd-complete-card .wd-info-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.15)}
.wd-complete-card .wd-info-row:last-child{border-bottom:none}
.wd-complete-card button{background:#fff;color:#059669;border:none;width:100%;padding:14px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
.wd-complete-card.rejected{background:linear-gradient(135deg,#7f1d1d 0%,#991b1b 100%);border-color:#ef4444}
.wd-complete-card.rejected h2{color:#fca5a5}
.wd-complete-card.rejected .wd-amt{color:#fca5a5}
.wd-complete-card.rejected p{color:#fecaca}
.wd-complete-card.rejected button{color:#dc2626}

/* Welcome */
.welcome-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:999999;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;padding:20px}
.welcome-popup-overlay.active{opacity:1;visibility:visible}
.welcome-popup-card{background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 50%,#6366f1 100%);border-radius:26px;padding:28px 22px;width:100%;max-width:360px;text-align:center;transform:scale(.7);transition:transform .4s;border:2px solid rgba(167,139,250,.4);position:relative;overflow:hidden}

.welcome-popup-card .wp-emoji{font-size:68px;margin-bottom:12px;animation:wpBounce 1.6s infinite;position:relative;z-index:2}
@keyframes wpBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}

.welcome-popup-card .wp-list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.1);color:#e2e8f0;font-size:13px;font-weight:700}
.welcome-popup-card .wp-list-item:last-child{border-bottom:none}
.welcome-popup-card .wp-list-item .ico{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.welcome-popup-card .wp-list-item .txt{flex:1;line-height:1.4}
.welcome-popup-card .wp-list-item .txt b{color:#fbbf24}
.welcome-popup-card .wp-btn{width:100%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:15px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;position:relative;z-index:2}
.welcome-popup-card .wp-tag{display:inline-block;background:rgba(251,191,36,.2);color:#fbbf24;font-size:10px;font-weight:900;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;border:1px solid rgba(251,191,36,.4);position:relative;z-index:2}
